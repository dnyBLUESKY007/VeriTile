name: Interp target

on:
  pull_request:
    branches: [main]
    paths: ['VeriTile/**', 'lakefile.toml', 'lake-manifest.json', 'lean-toolchain', 'scripts/**', '!scripts/interp/**', '!scripts/gpurun/**', '.github/actions/setup-comparator/**', '.github/workflows/fork-target.yml', '.github/workflows/interp.yml']
  push:
    branches: [main]
    paths: ['VeriTile/**', 'lakefile.toml', 'lake-manifest.json', 'lean-toolchain', 'scripts/**', '!scripts/interp/**', '!scripts/gpurun/**', '.github/actions/setup-comparator/**', '.github/workflows/fork-target.yml', '.github/workflows/interp.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interp:
    uses: ./.github/workflows/fork-target.yml
    with:
      library: VeriTileInterp
